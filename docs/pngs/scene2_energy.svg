<rect width="1600" height="900" fill="url(#sky)"/>
<text x="46" y="58" font-size="34" font-weight="bold" fill="#1F4E79">Where the sunlight goes, and why melting ice matters</text>
<text x="46" y="92" font-size="21" fill="#4a5560">Bright surfaces send sunlight straight back. Darker ones absorb it. Greenhouse gases slow the heat leaving again.</text><rect x="0" y="120" width="1600" height="330" fill="#cfe6f6" opacity="0.55"/><text x="1460" y="180" font-size="22" fill="#4a5560" text-anchor="end">ATMOSPHERE</text><line x1="190" y1="150" x2="278.0" y2="150.0" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="266.21025499268166" y2="193.9999662948785" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="234.00006741021718" y2="226.21019661368382" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="190.0001167579509" y2="237.99999999992255" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="146.00013482053765" y2="226.21031337154528" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="113.78986176544815" y2="194.0001685254784" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="102.00000000030983" y2="150.0002335159018" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="113.78962824972521" y2="106.00023593603122" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="145.99973035933783" y2="73.7899201447143" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="189.99964972614723" y2="62.00000000069711" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="233.99966294839777" y2="73.7895698711299" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><line x1="190" y1="150" x2="266.2100214758854" y2="105.99962924423157" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity="0.85"/><circle cx="190" cy="150" r="46" fill="#ffd34d"/><path d="M0,620 L1600,620 L1600,900 L0,900 Z" fill="url(#sea)"/><path d="M0,620 L470,620 L430,570 L0,570 Z" fill="#ffffff"/><path d="M1150,620 L1600,620 L1600,560 L1250,560 Z" fill="#72c64c"/><text x="210" y="600" font-size="21" fill="#4a5560" text-anchor="middle">ice and snow</text><text x="1000" y="760" font-size="21" fill="#ffffff" text-anchor="middle">open sea</text><text x="1400" y="600" font-size="21" fill="#2b4a20" text-anchor="middle">land</text><path d="M330,210 L260,560" fill="none" stroke="#ffd34d" stroke-width="9" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M720,210 L650,560" fill="none" stroke="#ffd34d" stroke-width="9" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M1180,210 L1110,560" fill="none" stroke="#ffd34d" stroke-width="9" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><rect x="323.76" y="279.1" width="212.48000000000002" height="31.9" rx="7" fill="#ffffff" opacity="0.82"/><text x="430" y="300" font-size="22" fill="#9a7a10" text-anchor="middle">incoming sunlight</text><path d="M260,560 L330,210" fill="none" stroke="#ffd34d" stroke-width="9" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0" stroke-dasharray="16 12"/><rect x="71.8" y="380.05" width="236.4" height="30.45" rx="7" fill="#ffffff" opacity="0.82"/><text x="190" y="400" font-size="21" fill="#9a7a10" text-anchor="middle">most of it reflected</text><circle cx="650" cy="600" r="26" fill="#d1495b" opacity="0.5"/><text x="700" y="690" font-size="22" fill="#ffffff" text-anchor="middle">dark water absorbs it: the sea warms</text><path d="M900,570 L900,200" fill="none" stroke="#d1495b" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M1000,430 L1000,570" fill="none" stroke="#d1495b" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0" stroke-dasharray="14 10"/><rect x="700" y="380" width="640" height="54" rx="26" fill="#5b6770" opacity="0.35"/><text x="1020" y="412" font-size="22" fill="#2b3338" text-anchor="middle">greenhouse gases: part of the heat comes back down</text><rect x="770.88" y="230.05" width="258.24" height="30.45" rx="7" fill="#ffffff" opacity="0.82"/><text x="900" y="250" font-size="21" fill="#d1495b" text-anchor="middle">heat leaving for space</text><path d="M430,570 L470,620" stroke="#2166AC" stroke-width="6" stroke-dasharray="12 9"/><path d="M470,640 Q580,700 700,640" fill="none" stroke="#2166AC" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><text x="640" y="810" font-size="24" fill="#ffffff" text-anchor="middle">as ice melts, darker sea takes its place — and absorbs more</text></svg>