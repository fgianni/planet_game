<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe4f7"/><stop offset="1" stop-color="#eaf6fd"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa0d8"/><stop offset="1" stop-color="#1a5d97"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<text x="46" y="58" font-size="34" font-weight="bold" fill="#1F4E79">Where the carbon goes</text>
<text x="46" y="92" font-size="21" fill="#4a5560">Forests, soils and the ocean take some of it back. What they cannot absorb stays in the air for centuries.</text><rect x="0" y="150" width="1600" height="300" fill="#5b6770" opacity="0.18"/><text x="150" y="200" font-size="24" fill="#3a4348" text-anchor="start">CARBON IN THE AIR</text><path d="M0,620 L700,620 L760,585 L1600,585 L1600,900 L0,900 Z" fill="#72c64c"/><rect x="0" y="620" width="470" height="280" fill="url(#sea)"/><path d="M1180,585 L1600,585 L1600,660 L1180,660 Z" fill="#dfe8ee"/><text x="1390" y="625" font-size="21" fill="#4a5560" text-anchor="middle">frozen ground (permafrost)</text><rect x="756.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="760" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="808.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="812" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="860.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="864" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="912.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="916" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="964.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="968" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="1016.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="1020" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="1068.55" y="583.9" width="6.8999999999999995" height="20.7" fill="#7a4f2e"/><circle cx="1072" cy="572.4" r="18.4" fill="#4e9c3a"/><rect x="554.92" y="679.1" width="750.1600000000001" height="31.9" rx="7" fill="#ffffff" opacity="0.82"/><text x="930" y="700" font-size="22" fill="#2b4a20" text-anchor="middle">forests and soils absorb carbon — until they burn or are cleared</text><text x="235" y="800" font-size="22" fill="#ffffff" text-anchor="middle">the ocean absorbs about a quarter of it</text><rect x="560" y="520" width="120" height="66" fill="#b9a7a0" stroke="#4a5560" stroke-width="3"/><rect x="600" y="455" width="26" height="70" fill="#8c7c78" stroke="#4a5560" stroke-width="3"/><circle cx="616" cy="430" r="16" fill="#6f6a67" opacity="0.6"/><circle cx="642" cy="392" r="23" fill="#6f6a67" opacity="0.5"/><circle cx="668" cy="354" r="30" fill="#6f6a67" opacity="0.39999999999999997"/><circle cx="694" cy="316" r="37" fill="#6f6a67" opacity="0.29999999999999993"/><path d="M660,380 L700,250" fill="none" stroke="#6f6a67" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><rect x="599.3199999999999" y="279.1" width="521.36" height="31.9" rx="7" fill="#ffffff" opacity="0.82"/><text x="860" y="300" font-size="22" fill="#3a4348" text-anchor="middle">emissions from industry, power and transport</text><path d="M300,640 L300,440" fill="none" stroke="#2f8fd0" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0" stroke-dasharray="14 10"/><rect x="225.48000000000002" y="395.05" width="149.04" height="30.45" rx="7" fill="#ffffff" opacity="0.82"/><text x="300" y="415" font-size="21" fill="#1a5d97" text-anchor="middle">ocean uptake</text><path d="M980,560 L980,420" fill="none" stroke="#3F6E4A" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0" stroke-dasharray="14 10"/><rect x="905.48" y="375.05" width="149.04" height="30.45" rx="7" fill="#ffffff" opacity="0.82"/><text x="980" y="395" font-size="21" fill="#2b4a20" text-anchor="middle">plant growth</text><path d="M1360,580 L1360,430" fill="none" stroke="#d1495b" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><rect x="1143.52" y="385.05" width="432.96000000000004" height="30.45" rx="7" fill="#ffffff" opacity="0.82"/><text x="1360" y="405" font-size="21" fill="#d1495b" text-anchor="middle">thawing ground releases its own carbon</text></svg>