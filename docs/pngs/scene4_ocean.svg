<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe4f7"/><stop offset="1" stop-color="#eaf6fd"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa0d8"/><stop offset="1" stop-color="#1a5d97"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<text x="46" y="58" font-size="34" font-weight="bold" fill="#1F4E79">The ocean's conveyor, and how it can stop</text>
<text x="46" y="92" font-size="21" fill="#4a5560">Warm water flows poleward at the surface, gives up its heat, sinks, and returns in the deep. Fresh meltwater can switch the sinking off.</text><rect x="0" y="230" width="1600" height="670" fill="url(#sea)"/><rect x="0" y="0" width="1600" height="230" fill="url(#sky)"/><path d="M0,230 L250,230 L250,180 L0,180 Z" fill="#ffffff"/><path d="M1330,230 L1600,230 L1600,150 L1400,150 Z" fill="#72c64c"/><text x="130" y="205" font-size="21" fill="#4a5560" text-anchor="middle">polar ice</text><text x="1470" y="195" font-size="21" fill="#2b4a20" text-anchor="middle">tropics</text><ellipse cx="520.0" cy="120.0" rx="48.0" ry="37.440000000000005" fill="#ffffff" opacity="0.97"/><ellipse cx="561.6" cy="102.4" rx="36.800000000000004" ry="28.704000000000004" fill="#ffffff" opacity="0.97"/><ellipse cx="600.0" cy="123.2" rx="33.6" ry="26.208" fill="#ffffff" opacity="0.97"/><ellipse cx="483.2" cy="128.0" rx="32.0" ry="24.960000000000004" fill="#ffffff" opacity="0.97"/><ellipse cx="548.8" cy="136.0" rx="36.800000000000004" ry="28.704000000000004" fill="#ffffff" opacity="0.97"/><ellipse cx="1050.0" cy="95.0" rx="54.0" ry="42.120000000000005" fill="#ffffff" opacity="0.97"/><ellipse cx="1096.8" cy="75.2" rx="41.4" ry="32.292" fill="#ffffff" opacity="0.97"/><ellipse cx="1140.0" cy="98.6" rx="37.800000000000004" ry="29.483999999999998" fill="#ffffff" opacity="0.97"/><ellipse cx="1008.6" cy="104.0" rx="36.0" ry="28.080000000000002" fill="#ffffff" opacity="0.97"/><ellipse cx="1082.4" cy="113.0" rx="41.4" ry="32.292" fill="#ffffff" opacity="0.97"/><path d="M1420,320 Q950,250 420,320" fill="none" stroke="#d1495b" stroke-width="16" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><text x="950" y="355" font-size="24" fill="#ffffff" text-anchor="middle">warm surface current carries heat poleward</text><path d="M700,300 Q670,235 690,175" fill="none" stroke="#e08a6a" stroke-width="7" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M830,300 Q800,235 820,175" fill="none" stroke="#e08a6a" stroke-width="7" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M960,300 Q930,235 950,175" fill="none" stroke="#e08a6a" stroke-width="7" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><rect x="579.28" y="119.1" width="601.44" height="31.9" rx="7" fill="#ffffff" opacity="0.82"/><text x="880" y="140" font-size="22" fill="#b0522f" text-anchor="middle">heat given up to the air — it keeps that coast mild</text><path d="M400,340 Q330,480 360,660" fill="none" stroke="#2166AC" stroke-width="16" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><text x="250" y="600" font-size="22" fill="#ffffff" text-anchor="middle">cold, salty water sinks</text><path d="M380,720 Q900,800 1450,720" fill="none" stroke="#2166AC" stroke-width="14" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><text x="950" y="790" font-size="22" fill="#ffffff" text-anchor="middle">deep return flow</text><path d="M180,235 L210,330" fill="none" stroke="#9fe0ff" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M230,235 L260,330" fill="none" stroke="#9fe0ff" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><path d="M280,235 L310,330" fill="none" stroke="#9fe0ff" stroke-width="8" marker-end="url(#ar)" stroke-linecap="round" opacity="1.0"/><text x="430" y="430" font-size="22" fill="#eaf6fd" text-anchor="middle">meltwater and extra rain make the surface fresh and light</text><rect x="120" y="300" width="380" height="16" rx="8" fill="#9fe0ff" opacity="0.85"/><text x="760" y="500" font-size="23" fill="#ffffff" text-anchor="middle">a fresh lid the water cannot break through: the sinking stops</text><text x="1150" y="620" font-size="22" fill="#ffffff" text-anchor="middle">the planet keeps warming — while that region cools</text></svg>