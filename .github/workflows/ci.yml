name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and libzstd
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPLANETSIM_BUILD_TESTS=ON

      - name: Floating-point policy (ADR-0002 §4.6)
        run: python3 tools/ci/check_fp_flags.py build

      - name: Presentation include boundary (ADR-0018 V2)
        run: python3 tools/ci/check_presentation_includes.py .

      - name: Build
        run: cmake --build build --parallel

      - name: Presentation include boundary (ADR-0018 V2)
        run: python3 tools/ci/check_presentation_includes.py .

      - name: Field registry append-only policy
        run: |
          ./build/planet_cli registry dump > build/field_registry_current.tsv
          python3 tools/ci/check_field_registry.py \
            tools/ci/field_registry_baseline.tsv build/field_registry_current.tsv

      - name: Channel registry append-only policy
        run: |
          ./build/planet_cli channels dump > build/channel_registry_current.tsv
          python3 tools/ci/check_channel_registry.py \
            tools/ci/channel_registry_baseline.tsv build/channel_registry_current.tsv

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Solar diagnostics
        if: matrix.build_type == 'Release'
        run: |
          ./build/planet_cli mesh --subdivision 6
          ./build/planet_cli solar --subdivision 5 --time-days 91.31055

      # Push CI gates a 25-year run at L5 and L6 on the 4-vCPU runner; the
      # 250-year runs and their replay are nightly (nightly.yml). Caps are
      # the runner's, not the reference machine's (ADR-0021 §13.6): with 4
      # workers a 16-thread machine took 58 s and 243 s, and the runner has
      # been about 1.6 times slower.
      - name: Climate-mode performance gate (ADR-0001 §5, V4; ADR-0021 §13.6)
        if: matrix.build_type == 'Release'
        run: |
          ./build/planet_cli run --subdivision 5 --years 25 \
            --min-years-per-minute 10 --max-seconds 180 --manifest run_L5_25y.prun
          ./build/planet_cli run --subdivision 6 --years 25 \
            --min-years-per-minute 2.5 --max-seconds 720

      - name: Replay the 25-year run (ADR-0003 V2)
        if: matrix.build_type == 'Release'
        run: ./build/planet_cli replay run_L5_25y.prun

      - name: Operator validation (ADR-0002 V3/V4)
        if: matrix.build_type == 'Release'
        run: >
          ./build/planet_cli operators --min-subdivision 2 --max-subdivision 6
          --error-map operator_error_map_L6.csv

      - name: Upload operator error map
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: operator-error-map
          path: operator_error_map_L6.csv

  sanitizers:
    name: ASan+UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and libzstd
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev pkg-config

      # ASan runtimes before LLVM 18 hang or crash at startup when the kernel
      # uses 32 bits of mmap randomization, as recent Ubuntu kernels do.
      - name: Limit mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPLANETSIM_BUILD_TESTS=ON
          -DPLANETSIM_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Field registry append-only policy
        run: |
          ./build/planet_cli registry dump > build/field_registry_current.tsv
          python3 tools/ci/check_field_registry.py \
            tools/ci/field_registry_baseline.tsv build/field_registry_current.tsv

      - name: Channel registry append-only policy
        run: |
          ./build/planet_cli channels dump > build/channel_registry_current.tsv
          python3 tools/ci/check_channel_registry.py \
            tools/ci/channel_registry_baseline.tsv build/channel_registry_current.tsv

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  godot-readability:
    name: Godot style readability
    runs-on: ubuntu-24.04
    env:
      GODOT_CPP_COMMIT: 4bc6e67d51df4c12e150fe4769911e239c627a47
      GODOT_VERSION: 4.2.2
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install build and software-rendering dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          ninja-build libzstd-dev pkg-config unzip xvfb mesa-utils

      - name: Fetch pinned Godot C++ bindings
        run: |
          git init godot-cpp
          git -C godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C godot-cpp fetch --depth 1 origin "$GODOT_CPP_COMMIT"
          git -C godot-cpp checkout --detach FETCH_HEAD

      - name: Fetch pinned Godot editor
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip -d godot-engine
          mv "godot-engine/Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot4
          chmod +x godot4

      - name: Build Godot extension
        run: |
          cmake -S . -B build-godot -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLANETSIM_BUILD_TESTS=OFF \
            -DPLANETSIM_BUILD_GODOT_EXTENSION=ON \
            -DGODOT_CPP_PATH="$PWD/godot-cpp"
          cmake --build build-godot --parallel 4

      # Godot loads GDExtensions from .godot/extension_list.cfg, which the
      # editor writes during its first filesystem scan; `--editor --quit`
      # aborts that scan (4.2 has no waiting --import), so without the list
      # PlanetMeshNode is never registered and the scripts fail to parse.
      - name: Import Godot project
        run: |
          mkdir -p godot/.godot
          printf 'res://planetsim.gdextension\n' > godot/.godot/extension_list.cfg
          xvfb-run -a ./godot4 --editor --quit --display-driver x11 \
            --rendering-driver opengl3 --audio-driver Dummy --path godot

      - name: Bridge styles, live overlays and switching (V7/V9, R2–R4)
        run: |
          ./build-godot/planet_cli run --subdivision 2 --years 1 --workers 1 \
            --presentation-record /tmp/planetsim-r1-ci.pframe
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_style_switch.gd -- \
            /tmp/planetsim-r1-ci.pframe
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_r2_overlay.gd -- \
            /tmp/planetsim-r1-ci.pframe
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_display_transfer.gd
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_cell_texels.gd
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_detail_coverage.gd
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/test_scene_lighting.gd -- --subdivision=4

      - name: Render and measure style readability (V8)
        run: |
          xvfb-run -a ./godot4 --display-driver x11 --rendering-driver opengl3 \
            --audio-driver Dummy --path godot \
            --script res://tests/render_readability.gd -- \
            --output="$PWD/readability-results"
          python3 tools/ci/check_readability.py \
            readability-results/manifest.json \
            --output readability-results/readability.json
          timeout 60s xvfb-run -a ./godot4 --display-driver x11 \
            --rendering-driver opengl3 --audio-driver Dummy --path godot -- \
            --subdivision=4 --live=true --water=true --view=8 \
            --screenshot="$PWD/readability-results/live-precipitation.png" \
            --quit-after-screenshot=true

      - name: Upload readability analytics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readability-results
          path: readability-results
