name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and libzstd
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPLANETSIM_BUILD_TESTS=ON

      - name: Floating-point policy (ADR-0002 §4.6)
        run: python3 tools/ci/check_fp_flags.py build

      - name: Presentation include boundary (ADR-0018 V2)
        run: python3 tools/ci/check_presentation_includes.py .

      - name: Build
        run: cmake --build build --parallel

      - name: Presentation include boundary (ADR-0018 V2)
        run: python3 tools/ci/check_presentation_includes.py .

      - name: Field registry append-only policy
        run: |
          ./build/planet_cli registry dump > build/field_registry_current.tsv
          python3 tools/ci/check_field_registry.py \
            tools/ci/field_registry_baseline.tsv build/field_registry_current.tsv

      - name: Channel registry append-only policy
        run: |
          ./build/planet_cli channels dump > build/channel_registry_current.tsv
          python3 tools/ci/check_channel_registry.py \
            tools/ci/channel_registry_baseline.tsv build/channel_registry_current.tsv

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Solar diagnostics
        if: matrix.build_type == 'Release'
        run: |
          ./build/planet_cli mesh --subdivision 6
          ./build/planet_cli solar --subdivision 5 --time-days 91.31055

      - name: Climate-mode performance gate (ADR-0001 §5, V4)
        if: matrix.build_type == 'Release'
        run: |
          ./build/planet_cli run --subdivision 5 --years 250 \
            --min-years-per-minute 20 --max-seconds 240 --manifest run_L5_250y.prun
          ./build/planet_cli run --subdivision 6 --years 250 \
            --min-years-per-minute 5 --max-seconds 750

      - name: Replay the 250-year run (ADR-0003 V2)
        if: matrix.build_type == 'Release'
        run: ./build/planet_cli replay run_L5_250y.prun

      - name: Operator validation (ADR-0002 V3/V4)
        if: matrix.build_type == 'Release'
        run: >
          ./build/planet_cli operators --min-subdivision 2 --max-subdivision 6
          --error-map operator_error_map_L6.csv

      - name: Upload operator error map
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: operator-error-map
          path: operator_error_map_L6.csv

  sanitizers:
    name: ASan+UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and libzstd
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev pkg-config

      # ASan runtimes before LLVM 18 hang or crash at startup when the kernel
      # uses 32 bits of mmap randomization, as recent Ubuntu kernels do.
      - name: Limit mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPLANETSIM_BUILD_TESTS=ON
          -DPLANETSIM_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Field registry append-only policy
        run: |
          ./build/planet_cli registry dump > build/field_registry_current.tsv
          python3 tools/ci/check_field_registry.py \
            tools/ci/field_registry_baseline.tsv build/field_registry_current.tsv

      - name: Channel registry append-only policy
        run: |
          ./build/planet_cli channels dump > build/channel_registry_current.tsv
          python3 tools/ci/check_channel_registry.py \
            tools/ci/channel_registry_baseline.tsv build/channel_registry_current.tsv

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
